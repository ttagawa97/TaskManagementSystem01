next_actions:
- Google Chromeでhttp://127.0.0.1:8000の共通画面を確認してもらう。
- 修正指示があればUI仕様とコードを更新し該当検証を行う。
- P1承認後にP2の初期管理者作成・仮パスワード配布と期限・セッション期限・最後の管理者の扱いを順次確認する。
