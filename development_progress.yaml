- check: 本番・負荷検証
  result: 保留。構築・実施なし。
runtime:
  url: http://127.0.0.1:8000
  compose_project: taskmanagementsystem01-dev
  state: app/db起動中・healthy確認済み
  start: bash execute/start-development.sh
  stop: bash execute/stop-development.sh
  tests: bash execute/test-development.sh
  restart_verification: python3 execute/verify-development.py
  secrets: .env.development（Git対象外・内容非表示・再生成不要）
handoff:
  portable_files:
  - specs/（正式仕様）
  - development_plan.md（段階計画）
  - development_progress.yaml（現在のフェーズ・ゲート・検証結果・次の作業）
  - app/
  - compose.development.yaml
  - execute/
  - README.md
  machine_local:
  - .env.development（秘密値。別PCでコピーせず再生成）
  - Dockerのtaskmanagementsystem01-dev_databaseボリューム
  - Dockerのtaskmanagementsystem01-dev_imagesボリューム
  resume_steps:
  - リポジトリ一式を別PCへ取得する。
  - development_progress.yamlのcurrent_phase・gate・next_actions・pending_questionを確認する。
  - Docker EngineとComposeを確認する。
  - python3 execute/prepare-development.pyを実行する。
  - bash execute/start-development.shを実行する。
  - 必要に応じてbash execute/test-development.shを実行する。
  data_migration: 現在はP1共通画面のみで業務データなし。Dockerボリュームの移行が必要になった場合は、バックアップ方式を決めてから実施する。
resolved_issues:
- 初回Dockerビルドで/mediaが既存だったためmkdir -pに修正し再ビルド成功。
- DB障害モックのSimpleTestCase後処理エラーをDB対応TestCaseに移し、5件すべて正常終了。
