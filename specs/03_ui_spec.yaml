specification: 03_ui_spec
schema_version: 1
authority: requirements/spec.txtとYAML生成前のユーザー回答を反映。生成後は本YAML群が正式仕様。
items:
- id: UI-011
  title: P1の共通画面確認
  status: 確定
  requirements:
  - P1はホームに共通ヘッダー、左ナビ、中央の案内、日本時間の日時を表示する。色・文字・配置はUI-001に従う。
  - 未実装のログイン・チケット等の業務操作は公開しない。P2以降で本来の認証・画面遷移へ置き換える。
  - 見つからないページとサーバーエラーは内部情報を含めず日本語で表示する。
  decision_reason: AI補完。段階開発のP1で、未実装機能を利用可能と誤認させず共通画面を確認するため。
  related_ids: [UI-001, UI-002, INF-009]
- id: UI-001
  title: 対象画面と共通構成
  status: 確定
  requirements:
  - PCブラウザー向け。画面はログイン、強制パスワード変更、ダッシュボード、チケット検索、プロジェクト一覧・設定、チケット一覧・詳細・登録編集、Wiki一覧・詳細・登録編集、ガント、マスター管理、ユーザー管理、監査ログ。
  - 画面上部にアプリ名とログインユーザーを配置する。ログインユーザー名を選択するとプルダウンを開き、「プロフィール変更」とログアウトを選べる。左側にプロジェクト選択と主要ナビゲーション、中央に見出し・操作・コンテンツを配置する。
  - フォントはsystem-uiと日本語sans-serif。本文16pxを基準。背景#F8FAFC、カード#FFFFFF、本文#0F172A、主操作#2563EB、危険操作#B91C1C。色だけで状態を区別せずラベルを併記する。
  - 入力にはラベル、必須表示、項目ごとのエラーを付ける。キーボード操作とフォーカス表示を提供する。削除・無効化・一括解除は対象を示して確認する。
  - 専用UIフレームワークは現時点では採用しない。DjangoテンプレートとCSS・JavaScriptで構築し、Markdown等の具体的なライブラリはINF-006に従う。
  decision_reason: ユーザーのPC向け指定を反映。配置・フォント・配色・標準操作はAIによるUI補完。
  related_ids:
  - OV-002
  - OV-003
  - INF-006
- id: UI-002
  title: 認証と画面遷移
  status: 確定
  requirements:
  - 未認証時はログイン画面。ログイン後、must_change_passwordが真ならパスワード再設定画面のみへ遷移し、完了後にダッシュボードへ移る。
  - ログインから24時間経過後の認証が必要な操作では、セッション期限切れを案内してログイン画面へ誘導する（OV-023）。
  - ダッシュボード、チケット検索、プロジェクト一覧、プロジェクト内のチケット・Wiki・ガントへ遷移する。権限を持つ利用者のみ設定・管理・ログ画面へのリンクを表示する。
  - ログインユーザー名のプルダウンからプロフィール変更を開く。プロフィール変更画面でパスワードを変更する。左ナビにパスワード変更項目は設けない。初回・初期化後の強制変更は従来どおり直接変更画面へ誘導する。
  - 初期化機能はユーザー管理画面から実施する。OV-022に従い、作成・初期化直後のみ仮パスワードを操作した管理者へ表示し、発行から72時間後の有効期限（日本時間）とTeamsで本人へ手動連携する案内を表示する。期限切れ時は管理者への再発行依頼を案内する。
  decision_reason: ユーザーが会話で確認・承認した要件。
  related_ids:
  - OV-007
  - OV-018
  - OV-022
  - OV-023
  - API-002
- id: UI-003
  title: チケット検索
  status: 確定
  requirements:
  - チケット検索はアクセス可能な全プロジェクトを横断し、担当者を含む条件で絞り込める。自分の担当チケット専用のメニュー項目は設けない。
  - 一覧上部にプロジェクト・ステータス・種別・担当ユーザー・優先度・キーワードの検索欄、下部にページ操作を配置する。進捗という独立値は設けない。
  - 一覧の列はID、タイトル、プロジェクト、ステータス、種別、優先度、担当者、開始日、期限、更新日時。行から詳細に移動する。
  - 完了やアーカイブを除外する固定条件は設けず、アクセス可能なチケットを表示し、利用者が条件で絞り込む。
  - キーワードはタイトルまたは説明文の部分一致。異なる条件間はAND、同じ項目の複数選択はOR。検索語は1つの文字列として扱う。
  - 複数プロジェクトを対象とする検索のステータス・種別は、表示名が同じ選択肢を1件に集約し、選択肢にプロジェクト名を含めない。同名を選択した場合は対象範囲内の全プロジェクトで同じ表示名を検索する。
  - ID、タイトル、プロジェクト、ステータス、種別、優先度、担当者、開始日、期限、更新日時の各列見出しをクリックしてソートできる。未選択列は昇順から始まり、選択中の列は昇順・降順・ソートなしの順に切り替わる。ソート中の見出しに昇順なら上向き三角、降順なら下向き三角を表示する。フィルター送信とページ移動ではソート状態を保持する。
  - 更新日時の降順、同時刻はIDの降順を標準とする。1ページ50件、最大100件。
  decision_reason: プロジェクト横断検索と担当条件による絞り込み、専用メニューを設けない方針、全カラムの昇順・降順・解除ソートはユーザー指定。未指定の標準的な検索・既定並び順・ページ分割はAI補完。
  related_ids:
  - OV-009
  - API-011
- id: UI-004
  title: チケット詳細・入力
  status: 確定
  requirements:
  - チケット編集画面ではパンくずリンクと状態バッジを置かず、見出しにはチケットタイトルのみを表示する。新規作成時の見出しは「チケット作成」とする。
  - 上部にタイトルと状態・主要操作、本文エリアにMarkdown説明と画像、属性エリアに種別・優先度・担当者・日程・親子関係を配置する。
  - 親・子チケットをリンク表示する。子の追加・既存チケットの紐付け・関係解除を提供し、2階層制約に違反する候補は選択させない。
  - 未完了の子がある親の完了操作では理由を表示する。親の自動差し戻しや担当者の自動解除は結果に表示する。
  - 本文下にコメント一覧と投稿欄、変更履歴を配置する。コメントの編集・削除操作は権限を持つユーザーに表示する。
  - 常時編集画面には説明欄とコメント本文欄をコンパクトな初期高さで表示し、Markdownの描画結果は各欄の「プレビュー」ボタンからモーダルで表示する。入力時の常時プレビューは行わない。既存チケットのタイトル行ではタイトルを左側、作成日と作成者を右側に表示する。
  - チケット編集欄の後にコメント投稿欄を置き、コメント履歴より先に表示する。各コメントに投稿者の投稿時点の表示名と投稿日時を表示し、コメント投稿者を入力で偽装できないようにする。アーカイブ中はコメント投稿欄を表示しない。
  - コメント投稿は本文または添付ファイルのいずれかを必須とし、複数ファイル選択を許可する。形式を限定せず、1ファイル10 MiB以下・1コメント10ファイル以下とする。既存添付はファイル名とサイズを表示し、認可付きダウンロードリンクを設ける。
  - アーカイブ時は閲覧専用表示とし、更新操作を表示しない。子がある親の削除不可理由を表示する。
  decision_reason: コメント入力、投稿者・日時の表示、添付形式を限定しないこと、編集画面のタイトルとポップアッププレビュー、画面内高さ調整はユーザー指定。本文・添付のいずれかを必須とする検証とアーカイブ時の投稿禁止は既存仕様と技術的整合性を適用。
  related_ids:
  - OV-006
  - OV-008
  - DATA-005
  - API-005
  - API-006
- id: UI-005
  title: Wiki
  status: 確定
  requirements:
  - プロジェクト別のページ一覧から詳細へ遷移し、参加者が作成・編集・削除できる。
  - タイトル、Markdown本文、画像、プレビュー、修正履歴を表示する。修正履歴は誰がいつ修正したかだけを表示する。
  - 差分表示・版復元ボタンを設けない。監査ログ全体は権限を持つ管理者の別画面で閲覧する。
  decision_reason: ユーザーが会話で確認・承認した要件。
  related_ids:
  - DATA-007
  - OV-012
  - API-007
- id: UI-006
  title: ガントチャート
  status: 確定
  requirements:
  - プロジェクト内で開始日と期限の両方を持つチケットだけを期間バーとして表示する。片方だけ・両方未設定のチケットはバー表示しない。
  - 縦軸にチケット、横軸に日付を表示し、親子は字下げと親へのリンクで区別する。親の日付未設定でも日付のある子は表示する。
  - 親の期間を子から自動算出しない。ドラッグによる日程変更や依存線編集は提供しない。バーからチケット詳細へ移動できる。
  - 表示期間を指定して、期間が重なるチケットをページ分割取得する。日付境界は開始日・期限を含む。
  decision_reason: 表示専用・日付条件はユーザー確定。AI補完として標準的な配置・期間絞り込みを定義。
  related_ids:
  - OV-008
  - DATA-005
  - API-011
- id: UI-007
  title: Markdown・添付共通UI
  status: 確定
  requirements:
  - 編集とプレビューを切り替えられる。画像選択時に形式・容量・残り枚数を表示し、上限違反は送信前とサーバー側で検証する。
  - 画像は縮小表示から閲覧できる。画像単独削除ボタンの表示権限はOV-020の解消後に確定する。
  decision_reason: AI補完。一般的なCRUD・入力検証・技術的整合性を具体化するため。
  related_ids:
  - OV-013
  - OV-020
  - API-008
- id: UI-008
  title: プロジェクト・参加者管理
  status: 確定
  requirements:
  - システム管理者向けにプロジェクト作成と管理者指定を提供する。管理者は最低1名必要で、複数指定できる。
  - 参加者一覧で管理者・一般参加者を区別し、参加者追加・削除、対象ユーザーの未完了担当チケット一括解除を提供する。
  - 参加者削除前に未完了担当件数と完了済みのunknown置換件数を表示し、制約違反は理由を表示する。
  - プロジェクト一覧・設定にアーカイブ状態を表示する。アーカイブ・解除は確認ダイアログを伴う。
  decision_reason: AI補完。一般的なCRUD・入力検証・技術的整合性を具体化するため。
  related_ids:
  - OV-005
  - OV-009
  - OV-011
  - API-004
- id: UI-009
  title: 履歴・監査ログ
  status: 確定
  requirements:
  - 監査画面は操作者・日時・対象・操作・変更前後の値を表示し、プロジェクト、対象、操作者、日時で絞り込み・ページ分割する。
  - システム管理者は全体、プロジェクト管理者は担当プロジェクトのみ。一般参加者向けの全体ログ画面は設けない。
  - チケット詳細では当該チケットに関係するログをそのまま表示する。Wikiの参加者向け表示は操作者・日時だけ。
  - ログ編集・削除・復元操作は設けない。削除済みチケットの一般参加者向け専用導線はOV-019に従い未決。
  decision_reason: ユーザーが会話で確認・承認した要件。
  related_ids:
  - OV-012
  - OV-019
  - DATA-009
  - API-010
- id: UI-010
  title: マスター・ユーザー管理
  status: 確定
  requirements:
  - マスター画面はプロジェクト別にステータスと種別を表示し、追加・名称変更・無効化・再有効化を提供する。必須ステータスは固定であることを明示する。
  - 無効化済みマスターは既存チケットで表示を維持する。マスター削除ボタンは設けない。
  - ユーザー管理はシステム管理者のみ。ユーザー作成・情報編集・無効化・パスワード初期化を提供し、物理削除は提供しない。
  - ユーザー無効化時は、アーカイブ分を含む未完了担当チケットと最後のプロジェクト管理者の制約を表示する。
  decision_reason: AI補完。一般的なCRUD・入力検証・技術的整合性を具体化するため。
  related_ids:
  - DATA-004
  - OV-007
  - OV-010
  - OV-020
  - API-003
  - API-009

- id: UI-012
  title: P2認証・ユーザー管理画面
  status: 確定
  requirements:
  - 共通配色・レイアウトを維持し、ヘッダーのユーザー名プルダウンからプロフィール変更とPOSTログアウトを選べるようにする。パスワード変更はプロフィール変更画面内で行う。左ナビにダッシュボード・チケット検索・プロジェクト一覧・管理者限定の設定を配置する（設定からユーザー管理へ移動）。再設定前は業務リンクを表示しない。
  - ログインはID・パスワード、変更は現在のパスワード・新パスワード・確認。ユーザー一覧は50件でページ分割しID・表示名・管理者権限・有効状態を表示する。
  - 作成・編集はID・表示名・管理者権限を入力する。初期化は対象ユーザーを示す確認画面からPOSTする。無効化操作はP4まで公開しない。
  - ログイン・再設定後はP2ホームへ移動する。チケット検索はP4で導入し、P2では未実装の業務データや操作を表示しない。
  decision_reason: AI補完。P2の段階実装範囲と標準的なフォーム・ページ分割を具体化。既存UI-001のデザインを維持。
  related_ids: [UI-001, UI-002, UI-010, API-014, OV-020]

- id: UI-013
  title: P3プロジェクト・参加者・マスター画面
  status: 確定
  requirements:
  - 共通ナビにプロジェクト一覧を追加し、プロジェクト名から当該チケット一覧へ直接移動する。一覧の各行に別の「プロジェクト設定」を設け、そこから基本情報・参加者・ステータス・種別・アーカイブ操作へ移動する。既存の共通配色・フォント・配置を維持する。
  - 一覧はプロジェクト名・進行中／アーカイブ済み・更新日時（日本時間）。一覧・参加者・マスターは50件ずつページ分割する。
  - 作成画面は名前・説明・1名以上の有効な初期管理者（複数選択）。基本情報編集は名前・説明。参加者一覧ではユーザーID・表示名・管理者／一般参加者・有効状態を表示する。
  - 参加者追加は有効な未参加ユーザーから選択。管理者指定・解除は対象ユーザーを示す別画面でシステム管理者だけが行う。参加者削除はP4まで表示しない。
  - マスター一覧は名称・有効状態・編集リンク。必須ステータスは固定と明示し編集操作を表示しない。追加と名称編集・無効化・再有効化はシステム管理者または当該プロジェクト管理者に提供する。
  - アーカイブ中は閲覧専用と明示し、基本情報・参加者・管理者・マスターの変更操作を表示しない。権限を持つユーザーには解除操作を提供する。アーカイブ・解除は対象名付き確認画面から実行する。
  decision_reason: ユーザー指定の権限・アーカイブ制約を確定反映。標準的なフォーム・ページ分割と既存デザインの継承はAI補完。
  related_ids: [UI-001, UI-008, UI-010, API-015, OV-005, OV-011]

- id: UI-014
  title: P4第1区切りの基本チケット画面
  status: 確定
  requirements:
  - ログイン・パスワード変更後のホームはダッシュボードとする。プロジェクト未選択時の横断一覧入口は「チケット検索」とし、専用の自分の担当チケットメニューは設けない。プロジェクト選択後の作業画面では対象プロジェクト内のチケット一覧・操作、プロジェクト設定、ダッシュボードへの移動を提供する。
  - プロジェクトのチケット一覧から作成し、行から編集画面を直接開く。編集画面には対象ID・タイトルを表示し、削除は権限保有者のみ対象IDとタイトル付き確認へ進める。アーカイブ中は作成・編集・削除を非表示にする。
  - チケットの新規作成・編集を保存すると対象プロジェクトのチケット一覧へ遷移する。作成・編集フォームに一覧へ戻る「キャンセル」操作を配置し、保存せず対象プロジェクトのチケット一覧へ戻る。
  - PC向けのチケット詳細・編集は横幅を広く使う単一の編集画面とし、参照専用モードを設けない。既存チケット画面の見出しはチケットタイトルのみとし、同じ行の右側に作成日・作成者を右寄せ表示する。プロジェクト一覧へ戻るパンくずは置かない。説明は短めのMarkdown編集欄を表示し、描画結果はプレビューボタンからポップアップ表示する。コメント入力欄も履歴より先に置き、プレビューを同じポップアップ方式で表示する。アーカイブ中は既存の閲覧専用・変更禁止規則を適用する。
  - 入力順はタイトル、Markdown説明、ステータス、種別、優先度、担当者、開始日、期限。必須表示・項目エラー・キャンセルを提供し、無効マスターは現在値だけ保持可能とラベル表示する。
  - 検索の選択項目は折り畳み型プルダウンとし、内部のチェックボックスで複数選択する。閉じた状態では選択名と追加選択件数を表示する。常時展開の複数選択リストは使用しない。ユーザー指定の確定デザインとして、PCでは検索領域を画面高さの30％以内に収める方針とし、表示中の選択項目・キーワード・件数・操作を横一列に配置する。縦積み・複数行への折り返しは行わない。検索列は最小幅900pxとし、狭い画面でも横並びを維持する。見出しと一覧前後の余白も縮め、候補は一覧を押し下げず重ねて表示する。CSSの更新識別子をURLへ付け、旧CSSキャッシュが残らないようにする。
  - プロジェクトのチケット一覧はURLのプロジェクトに検索対象を固定し、プロジェクト選択条件を表示しない。チケット検索はアクセス可能なプロジェクトを横断し、担当者に本人を指定して自分の担当チケットを検索できる。どちらも表示する他の絞り込み項目は対象範囲に従う。
  - 検索一覧に「チケット検索」のページタイトルや階層を示すパンくずを表示しない。プロジェクト内一覧では上部の表示エリアにプロジェクト名を表示し、プロジェクト一覧・プロジェクト設定へのパンくずリンクは置かない。プロジェクト設定への導線は共通ナビを使う。
  - ステータスと種別のプルダウンはプロジェクト名を表示せず、同じ表示名を1項目に集約する。選択した項目名は一覧の検索対象範囲内にある同名の全ステータス・種別へ適用する。
  - 検索はUI-003に従い複数選択とキーワード、件数指定を提供する。ページ移動時も条件を保持する。表示日時は日本時間と明記する。
  - 説明欄はMarkdown入力を表示し、「プレビュー」ボタンの操作時に無害化済み描画結果をポップアップ表示する。見出し・強調・箇条書き・引用・コード・リンクを表示する。生HTMLは文字として表示し、画像添付・画像表示はP5で導入する。
  - 第1区切りでは親子関係の操作、参加者削除・担当一括解除・ユーザー無効化は公開せず、P4後続区切りで追加する。コメント・画像はP5、変更履歴閲覧はP6で導入し、監査記録自体は作成時から行う。
  decision_reason: PC向け横長レイアウト、タイトル行の右側に作成日・作成者を置く表示、編集画面のパンくず廃止、プレビューのボタン起動ポップアップ、コメント入力をスクロールなしで見やすくする高さ調整、一覧入口ごとの検索範囲、同名ステータス／種別の集約表示、チケット検索の名称と専用メニュー廃止、検索ページのパンくず非表示およびプロジェクト名表示はユーザー指定。承認済み段階計画とUI-001の標準配置・配色を継承。
  related_ids: [UI-001, UI-002, UI-003, UI-004, UI-007, UI-016, API-016, DATA-005]

- id: UI-016
  title: ログイン後ダッシュボードとプロジェクト作業ナビゲーション
  status: 確定
  requirements:
  - 認証後ホームとログイン・パスワード変更後の遷移先はダッシュボードとする。
  - ダッシュボードにユーザーが参加しているプロジェクト一覧と本人に割り当てられたチケットを表示する。本人担当チケットは参加可能な全プロジェクトを対象とする。
  - ダッシュボードのプロジェクトを選ぶと、そのプロジェクトのチケット一覧へ移動する。
  - プロジェクトを選択した画面のナビゲーションから、対象プロジェクトのチケット作業、プロジェクト設定、およびダッシュボードへ移動できる。チケット画面・プロジェクト設定の各画面で選択中のプロジェクトを維持する。
  - ダッシュボードの更新ログはUI-017で定義する。本人との関連範囲の確認が完了するまで実装を保留する。
  decision_reason: ダッシュボード構成とプロジェクト選択後の導線はユーザー指定。担当チケットのプロジェクト横断はUI-014の確定仕様を適用。
  related_ids: [UI-002, UI-013, UI-014, UI-017, API-017, OV-005]

- id: UI-017
  title: ダッシュボード更新ログの対象範囲
  status: 確定
  requirements:
  - ダッシュボードには本人が現在担当、作成、または過去に担当したことがあるチケットの更新ログを表示する。本人が行った更新であっても、これらに該当するチケット以外のログは含めない。
  - 過去の担当はチケット監査記録の担当者変更前後から判定する。現在アクセス可能なプロジェクトの既存チケットに対象を制限し、他プロジェクトや削除済みチケットは表示しない。
  - 更新日時の降順で最新20件を表示し、各行にチケットID・タイトル・更新者・操作・日時を表示する。
  decision_reason: 本人との関連条件（現在担当・作成・過去の担当）はユーザー指定。対象プロジェクトは既存認可に合わせ、表示件数・日時順は一覧画面の標準的な性能・可読性のためAI補完。
  related_ids: [UI-016, API-018, OV-012, DATA-009]
  affected_ids: [API-018]
  implementation_boundary: なし。

- id: UI-015
  title: 全体設定とプロジェクト設定の画面遷移
  status: 確定
  requirements:
  - 左ナビの「設定」から全体設定画面を開き、ユーザー管理へ移動する。全体設定には実装済みの項目のみ表示し、プロジェクト別マスターは置かない。既存のシステム管理者限定のユーザー管理権限を維持する。
  - プロジェクト一覧の名前リンクは当該プロジェクトのチケット一覧へ直接移動する。各行の別リンク「プロジェクト設定」は対象名を明示した設定画面へ移動する。
  - プロジェクト設定に基本情報・参加者・ステータス・種別・アーカイブと解除をまとめる。チケット一覧にもプロジェクト設定へのリンク、設定画面にはチケット一覧へ戻るリンクを置く。
  - 参加者・マスター等の設定子画面から対象プロジェクト設定へ戻れるようにする。プロジェクト作成・基本情報保存・アーカイブ操作後もプロジェクト設定へ戻る。
  - 設定変更の権限とアーカイブ中の変更禁止は既存仕様を維持する。一般参加者は従来同様にプロジェクト情報・参加者・マスターを閲覧でき、権限のない変更操作は表示しない。
  decision_reason: ユーザーが画面レビューで明示指定した確定導線。全体設定とプロジェクト設定を分け、プロジェクト選択からチケット作業へ直接進める。この導線を将来AI判断で再構成しない。
  related_ids: [UI-002, UI-008, UI-010, UI-012, UI-013, UI-014, API-015, OV-005, OV-011]
