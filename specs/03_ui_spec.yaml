specification: 03_ui_spec
schema_version: 1
authority: requirements/spec.txtとYAML生成前のユーザー回答を反映。生成後は本YAML群が正式仕様。
items:
- id: UI-011
  title: P1の共通画面確認
  status: 確定
  requirements:
  - P1はホームに共通ヘッダー、左ナビ、中央の案内、日本時間の日時を表示する。色・文字・配置はUI-001に従う。
  - 未実装のログイン・チケット等の業務操作は公開しない。P2以降で本来の認証・画面遷移へ置き換える。
  - 見つからないページとサーバーエラーは内部情報を含めず日本語で表示する。
  decision_reason: AI補完。段階開発のP1で、未実装機能を利用可能と誤認させず共通画面を確認するため。
  related_ids: [UI-001, UI-002, INF-009]
- id: UI-001
  title: 対象画面と共通構成
  status: 確定
  requirements:
  - PCブラウザー向け。画面はログイン、強制パスワード変更、自チケット、プロジェクト一覧・設定、チケット一覧・詳細・登録編集、Wiki一覧・詳細・登録編集、ガント、マスター管理、ユーザー管理、監査ログ。
  - 画面上部にアプリ名とログインユーザー・ログアウト、左側にプロジェクト選択と主要ナビゲーション、中央に見出し・操作・コンテンツを配置する。
  - フォントはsystem-uiと日本語sans-serif。本文16pxを基準。背景#F8FAFC、カード#FFFFFF、本文#0F172A、主操作#2563EB、危険操作#B91C1C。色だけで状態を区別せずラベルを併記する。
  - 入力にはラベル、必須表示、項目ごとのエラーを付ける。キーボード操作とフォーカス表示を提供する。削除・無効化・一括解除は対象を示して確認する。
  - 専用UIフレームワークは現時点では採用しない。DjangoテンプレートとCSS・JavaScriptで構築し、Markdown等の具体的なライブラリはINF-006に従う。
  decision_reason: ユーザーのPC向け指定を反映。配置・フォント・配色・標準操作はAIによるUI補完。
  related_ids:
  - OV-002
  - OV-003
  - INF-006
- id: UI-002
  title: 認証と画面遷移
  status: 確定
  requirements:
  - 未認証時はログイン画面。ログイン後、must_change_passwordが真ならパスワード再設定画面のみへ遷移し、完了後に自チケット画面へ移る。
  - ログインから24時間経過後の認証が必要な操作では、セッション期限切れを案内してログイン画面へ誘導する（OV-023）。
  - 自チケット→プロジェクト→チケット・Wiki・ガントへ遷移する。権限を持つ利用者のみ設定・管理・ログ画面へのリンクを表示する。
  - 初期化機能はユーザー管理画面から実施する。OV-022に従い、作成・初期化直後のみ仮パスワードを操作した管理者へ表示し、発行から72時間後の有効期限（日本時間）とTeamsで本人へ手動連携する案内を表示する。期限切れ時は管理者への再発行依頼を案内する。
  decision_reason: ユーザーが会話で確認・承認した要件。
  related_ids:
  - OV-007
  - OV-018
  - OV-022
  - OV-023
  - API-002
- id: UI-003
  title: 自チケットと検索一覧
  status: 確定
  requirements:
  - 起動画面はログインユーザーが担当するチケットを対象にする。本人が作成しただけのチケットは自チケットに含めない。
  - 一覧上部にプロジェクト・ステータス・種別・担当ユーザー・優先度・キーワードの検索欄、下部にページ操作を配置する。進捗という独立値は設けない。
  - 一覧の列はID、タイトル、プロジェクト、ステータス、種別、優先度、担当者、開始日、期限、更新日時。行から詳細に移動する。
  - 完了やアーカイブを除外する固定条件は設けず、アクセス可能な自チケットを表示し、利用者が条件で絞り込む。
  - キーワードはタイトルまたは説明文の部分一致。異なる条件間はAND、同じ項目の複数選択はOR。検索語は1つの文字列として扱う。
  - 更新日時の降順、同時刻はIDの降順を標準とする。1ページ50件、最大100件。
  decision_reason: 自チケットの定義と検索対象はユーザー確定。未指定の標準的な検索・並び順・ページ分割はAI補完。
  related_ids:
  - OV-009
  - API-011
- id: UI-004
  title: チケット詳細・入力
  status: 確定
  requirements:
  - 上部にタイトルと状態・主要操作、本文エリアにMarkdown説明と画像、属性エリアに種別・優先度・担当者・日程・親子関係を配置する。
  - 親・子チケットをリンク表示する。子の追加・既存チケットの紐付け・関係解除を提供し、2階層制約に違反する候補は選択させない。
  - 未完了の子がある親の完了操作では理由を表示する。親の自動差し戻しや担当者の自動解除は結果に表示する。
  - 本文下にコメント一覧と投稿欄、変更履歴を配置する。コメントの編集・削除操作は権限を持つユーザーに表示する。
  - アーカイブ時は閲覧専用表示とし、更新操作を表示しない。子がある親の削除不可理由を表示する。
  decision_reason: AI補完。一般的なCRUD・入力検証・技術的整合性を具体化するため。
  related_ids:
  - OV-006
  - OV-008
  - DATA-005
  - API-005
  - API-006
- id: UI-005
  title: Wiki
  status: 確定
  requirements:
  - プロジェクト別のページ一覧から詳細へ遷移し、参加者が作成・編集・削除できる。
  - タイトル、Markdown本文、画像、プレビュー、修正履歴を表示する。修正履歴は誰がいつ修正したかだけを表示する。
  - 差分表示・版復元ボタンを設けない。監査ログ全体は権限を持つ管理者の別画面で閲覧する。
  decision_reason: ユーザーが会話で確認・承認した要件。
  related_ids:
  - DATA-007
  - OV-012
  - API-007
- id: UI-006
  title: ガントチャート
  status: 確定
  requirements:
  - プロジェクト内で開始日と期限の両方を持つチケットだけを期間バーとして表示する。片方だけ・両方未設定のチケットはバー表示しない。
  - 縦軸にチケット、横軸に日付を表示し、親子は字下げと親へのリンクで区別する。親の日付未設定でも日付のある子は表示する。
  - 親の期間を子から自動算出しない。ドラッグによる日程変更や依存線編集は提供しない。バーからチケット詳細へ移動できる。
  - 表示期間を指定して、期間が重なるチケットをページ分割取得する。日付境界は開始日・期限を含む。
  decision_reason: 表示専用・日付条件はユーザー確定。AI補完として標準的な配置・期間絞り込みを定義。
  related_ids:
  - OV-008
  - DATA-005
  - API-011
- id: UI-007
  title: Markdown・添付共通UI
  status: 確定
  requirements:
  - 編集とプレビューを切り替えられる。画像選択時に形式・容量・残り枚数を表示し、上限違反は送信前とサーバー側で検証する。
  - 画像は縮小表示から閲覧できる。画像単独削除ボタンの表示権限はOV-020の解消後に確定する。
  decision_reason: AI補完。一般的なCRUD・入力検証・技術的整合性を具体化するため。
  related_ids:
  - OV-013
  - OV-020
  - API-008
- id: UI-008
  title: プロジェクト・参加者管理
  status: 確定
  requirements:
  - システム管理者向けにプロジェクト作成と管理者指定を提供する。管理者は最低1名必要で、複数指定できる。
  - 参加者一覧で管理者・一般参加者を区別し、参加者追加・削除、対象ユーザーの未完了担当チケット一括解除を提供する。
  - 参加者削除前に未完了担当件数と完了済みのunknown置換件数を表示し、制約違反は理由を表示する。
  - プロジェクト一覧・設定にアーカイブ状態を表示する。アーカイブ・解除は確認ダイアログを伴う。
  decision_reason: AI補完。一般的なCRUD・入力検証・技術的整合性を具体化するため。
  related_ids:
  - OV-005
  - OV-009
  - OV-011
  - API-004
- id: UI-009
  title: 履歴・監査ログ
  status: 確定
  requirements:
  - 監査画面は操作者・日時・対象・操作・変更前後の値を表示し、プロジェクト、対象、操作者、日時で絞り込み・ページ分割する。
  - システム管理者は全体、プロジェクト管理者は担当プロジェクトのみ。一般参加者向けの全体ログ画面は設けない。
  - チケット詳細では当該チケットに関係するログをそのまま表示する。Wikiの参加者向け表示は操作者・日時だけ。
  - ログ編集・削除・復元操作は設けない。削除済みチケットの一般参加者向け専用導線はOV-019に従い未決。
  decision_reason: ユーザーが会話で確認・承認した要件。
  related_ids:
  - OV-012
  - OV-019
  - DATA-009
  - API-010
- id: UI-010
  title: マスター・ユーザー管理
  status: 確定
  requirements:
  - マスター画面はプロジェクト別にステータスと種別を表示し、追加・名称変更・無効化・再有効化を提供する。必須ステータスは固定であることを明示する。
  - 無効化済みマスターは既存チケットで表示を維持する。マスター削除ボタンは設けない。
  - ユーザー管理はシステム管理者のみ。ユーザー作成・情報編集・無効化・パスワード初期化を提供し、物理削除は提供しない。
  - ユーザー無効化時は、アーカイブ分を含む未完了担当チケットと最後のプロジェクト管理者の制約を表示する。
  decision_reason: AI補完。一般的なCRUD・入力検証・技術的整合性を具体化するため。
  related_ids:
  - DATA-004
  - OV-007
  - OV-010
  - OV-020
  - API-003
  - API-009

- id: UI-012
  title: P2認証・ユーザー管理画面
  status: 確定
  requirements:
  - 共通配色・レイアウトを維持し、ヘッダーに表示名とPOSTログアウト、左ナビにホーム・パスワード変更・管理者限定のユーザー管理を配置する。再設定前は業務リンクを表示しない。
  - ログインはID・パスワード、変更は現在のパスワード・新パスワード・確認。ユーザー一覧は50件でページ分割しID・表示名・管理者権限・有効状態を表示する。
  - 作成・編集はID・表示名・管理者権限を入力する。初期化は対象ユーザーを示す確認画面からPOSTする。無効化操作はP4まで公開しない。
  - ログイン・再設定後はP2ホームへ移動する。自チケットはP4で導入し、P2では未実装の業務データや操作を表示しない。
  decision_reason: AI補完。P2の段階実装範囲と標準的なフォーム・ページ分割を具体化。既存UI-001のデザインを維持。
  related_ids: [UI-001, UI-002, UI-010, API-014, OV-020]

- id: UI-013
  title: P3プロジェクト・参加者・マスター画面
  status: 確定
  requirements:
  - 共通ナビにプロジェクト一覧を追加し、一覧から詳細へ移動する。詳細から参加者・ステータス・種別を選択する。既存の共通配色・フォント・配置を維持する。
  - 一覧はプロジェクト名・進行中／アーカイブ済み・更新日時（日本時間）。一覧・参加者・マスターは50件ずつページ分割する。
  - 作成画面は名前・説明・1名以上の有効な初期管理者（複数選択）。基本情報編集は名前・説明。参加者一覧ではユーザーID・表示名・管理者／一般参加者・有効状態を表示する。
  - 参加者追加は有効な未参加ユーザーから選択。管理者指定・解除は対象ユーザーを示す別画面でシステム管理者だけが行う。参加者削除はP4まで表示しない。
  - マスター一覧は名称・有効状態・編集リンク。必須ステータスは固定と明示し編集操作を表示しない。追加と名称編集・無効化・再有効化はシステム管理者または当該プロジェクト管理者に提供する。
  - アーカイブ中は閲覧専用と明示し、基本情報・参加者・管理者・マスターの変更操作を表示しない。権限を持つユーザーには解除操作を提供する。アーカイブ・解除は対象名付き確認画面から実行する。
  decision_reason: ユーザー指定の権限・アーカイブ制約を確定反映。標準的なフォーム・ページ分割と既存デザインの継承はAI補完。
  related_ids: [UI-001, UI-008, UI-010, API-015, OV-005, OV-011]
