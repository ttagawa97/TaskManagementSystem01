specification: 01_overall_spec
schema_version: 1
authority: requirements/spec.txtとYAML生成前のユーザー回答を反映。生成後は本YAML群が正式仕様。
items:
- id: OV-001
  title: 目的と正式仕様
  status: 確定
  requirements:
  - 複数ユーザーがブラウザーで共同利用する、Backlogを参考としたタスク管理Webアプリケーション。Backlogの全機能互換は要求しない。
  - 初期要件と本会話の確定回答を基に、人間の明示指示によってこの5ファイルを生成する。生成後はspecs配下のYAMLを正式仕様とする。
  - 以後、明示的な指示なしにrequirements/spec.txtを参照・更新・再検討しない。仕様変更は既存IDを維持した差分更新とする。
  decision_reason: ユーザーが会話で確認・承認した要件。
  related_ids: []
- id: OV-002
  title: 今回の機能範囲
  status: 確定
  requirements:
  - ユーザー管理、プロジェクト管理、参加者・管理者管理、チケットCRUD、ステータス・種別マスター、優先度、親子チケットを提供する。
  - 自チケット一覧、条件抽出、タイトル・説明文のキーワード検索、コメント、画像添付、Wiki、表示専用ガントチャートを提供する。
  - 監査ログ、チケット変更履歴、Wiki修正者・修正日時の履歴、ユーザー無効化、プロジェクトアーカイブを提供する。
  - 外部公開API、チケットの別プロジェクトへの移動、チケット間の依存関係、ガント上の日程編集、削除物の復元、Wikiの版復元、スマートフォン向け最適化は対象外。
  decision_reason: ユーザーが会話で確認・承認した要件。
  related_ids:
  - UI-001
  - API-001
- id: OV-003
  title: 採用技術と構成概要
  status: 確定
  requirements:
  - 画面はDjangoテンプレート、HTML、CSS、JavaScript。バックエンドはPythonとDjango。データベースはPostgreSQL。コンテナ管理はDocker Compose。
  - Djangoによるサーバー側画面生成を基本とし、必要な内部通信を実装する。独立したSPAは前提にしない。
  - 必要なライブラリはDjango、PostgreSQL用ドライバー、Markdown描画・HTML無害化・画像検証用ライブラリ。追加ライブラリの具体名・版は実装前に互換性を確認する。
  decision_reason: ユーザーが会話で確認・承認した要件。
  related_ids:
  - INF-001
  - INF-002
  - INF-003
  - INF-006
- id: OV-004
  title: 環境と利用規模
  status: 確定
  requirements:
  - 開発環境は社内ネットワーク。本番環境はインターネット公開の想定だが、構成・構築詳細は保留。
  - 登録ユーザー約1000人、同時利用者約500人、チケット総数約1000000件を想定する。性能達成を保証する数値ではない。
  - PCブラウザー向けとし、開発環境の日時表示・日付判定はAsia/Tokyoに統一する。
  - 必要な環境の構築対象は人間が決定する。今回のYAML生成指示は環境構築や起動確認の指示ではない。
  decision_reason: ユーザーが会話で確認・承認した要件。
  related_ids:
  - INF-001
  - INF-004
  - INF-005
  - INF-006
- id: OV-005
  title: 権限モデル
  status: 確定
  requirements:
  - システム管理者はユーザーとプロジェクトを管理し、プロジェクト管理者の指定・変更を行う。管理者指定・変更はシステム管理者のみ可能。
  - プロジェクト管理者はプロジェクト参加者であり、1プロジェクトに複数名を設定できる。各プロジェクトには有効な管理者が最低1名必要。
  - 最後のプロジェクト管理者を外す・無効化する場合は先に別の有効な管理者を指定する。アーカイブ中もこの制約を維持する。
  - システム管理者は参加していないプロジェクトも含めてチケット・Wikiを閲覧・編集できる。
  - 通常のユーザーは参加中のプロジェクトだけにアクセスできる。参加者から外れた作成者・投稿者もアクセス権を失う。
  - 参加者の追加・削除、アーカイブ・解除はシステム管理者と当該プロジェクト管理者が行う。
  - ステータス・種別マスターの操作は当該プロジェクト管理者が行う。システム管理者という理由だけでマスター変更権限を付与するかはOV-020で未決。
  decision_reason: ユーザーが会話で確認・承認した要件。
  related_ids:
  - DATA-001
  - DATA-002
  - DATA-003
  - API-003
  - API-004
  - OV-020
- id: OV-006
  title: チケットとコメントの操作権限
  status: 確定
  requirements:
  - チケットの作成・編集はプロジェクト内の全参加者が行える。削除はシステム管理者、当該プロジェクト管理者、参加中の作成者のみ可能。
  - コメントは参加者が投稿でき、編集・削除は投稿者本人、システム管理者、当該プロジェクト管理者のみ可能。一般投稿者は参加中であることが必要。
  - Wikiは参加者が閲覧・作成・編集・削除できる。ガントチャートは閲覧のみ。
  - アーカイブ時はコンテンツ変更権限より閲覧専用制約を優先する。
  decision_reason: ユーザーが会話で確認・承認した要件。
  related_ids:
  - OV-005
  - OV-011
  - API-005
  - API-006
  - API-007
- id: OV-007
  title: 認証とパスワード
  status: 確定
  requirements:
  - システム管理者がユーザーIDと仮パスワードを発行する。ユーザーID・パスワードでログインする。
  - 新規ユーザーと管理者によるパスワード初期化後のユーザーは、仮パスワードでログインし本人が再設定する。再設定完了まで他の業務機能を利用できない。
  - パスワードを忘れた場合はシステム管理者が初期化する。メールによる自己復旧は今回の仕様に含めない。
  - パスワードは12文字以上。Django標準の検証により一般的すぎるもの、ユーザーIDに類似するもの、数字のみのものを禁止する。一般的すぎるかどうかは既知の共通パスワードリストで判定する。
  - 無効化ユーザーおよび特殊ユーザーunknownはログインできない。
  decision_reason: ユーザーが会話で確認・承認した要件。
  related_ids:
  - DATA-001
  - API-002
  - OV-016
  - OV-017
- id: OV-008
  title: 親子チケットと状態遷移
  status: 確定
  requirements:
  - 親子関係は同一プロジェクト内の親→子の2階層のみ。親は複数の子を持てるが、子は親を1件だけ持つ。孫、自分自身との紐付け、循環は禁止。
  - 完了判定は必須ステータスの完了だけ。処理済みおよび追加ステータスは未完了扱い。
  - すべての子が完了した場合に限り親を手動で完了にできる。子の完了によって親を自動完了にしない。
  - 完了済みの親の子を未完了へ変更した場合、または未完了の子を新規作成・紐付けした場合は、親を自動で処理中に戻す。
  - 親子制約以外のステータス遷移は自由。未対応から完了、完了から処理中などを許可する。
  - 子が残っている親の削除は禁止。先に子を削除するか親子関係を解除する。
  - 親子の日程は独立。子の期間が親の期間外でも許可する。
  decision_reason: ユーザーが会話で確認・承認した要件。
  related_ids:
  - DATA-004
  - DATA-005
  - API-005
- id: OV-009
  title: 担当者と参加者削除
  status: 確定
  requirements:
  - 担当者は同一プロジェクトの有効な参加者1名、または未割り当て。起動画面の自チケットはログインユーザーが担当者のもの。
  - システム管理者と当該プロジェクト管理者は、対象ユーザーの未完了チケットを当該プロジェクト内で一括して未割り当てに変更できる。完了済みは一括解除の対象外。
  - 未完了の担当チケットが残っている参加者は削除できない。完了済みだけが残っている場合は、その担当者をunknownに自動置換して参加者を削除する。
  - unknownは全システム共通の特殊ユーザー。手動選択不可であり、参加者削除時の自動置換にのみ使用する。
  - unknownまたは無効化済みユーザーが担当するチケットを未完了に戻す場合、担当者は自動で未割り当てにする。親の自動差し戻しも同様。
  decision_reason: ユーザーが会話で確認・承認した要件。
  related_ids:
  - DATA-001
  - DATA-003
  - DATA-005
  - API-004
  - API-005
- id: OV-010
  title: ユーザー無効化
  status: 確定
  requirements:
  - ユーザーは削除せず無効化する。投稿者情報と監査ログを保持し、ログインを禁止する。
  - 全プロジェクトの未完了担当チケットを引き継ぐか未割り当てにするまで無効化を禁止する。
  - 完了済みチケットの担当者は、無効化のみでは変更しない。参加者削除時はunknownに置換する。
  - アーカイブ済みプロジェクトの未完了担当チケットも制限対象。担当変更する場合は先にアーカイブ解除が必要。
  decision_reason: ユーザーが会話で確認・承認した要件。
  related_ids:
  - OV-005
  - OV-009
  - OV-011
  - API-003
- id: OV-011
  title: アーカイブ
  status: 確定
  requirements:
  - プロジェクトの終了は削除ではなくアーカイブとする。未完了チケットがあってもアーカイブできる。
  - アーカイブと解除はシステム管理者または当該プロジェクト管理者が実施する。
  - アーカイブ後のチケット・コメント・Wiki・添付画像は閲覧専用。担当一括解除を含むコンテンツ変更前にアーカイブ解除を必要とする。
  decision_reason: ユーザー承認事項。担当者制限にアーカイブ分を含める点は、整合性を保つ対応を任されたため採用。
  related_ids:
  - OV-006
  - OV-010
  - API-004
- id: OV-012
  title: 削除と変更履歴
  status: 確定
  requirements:
  - チケット・コメント・Wikiは完全削除し、ゴミ箱・復元機能を設けない。Wikiの過去の版へ戻す機能も設けない。
  - Wiki・チケット・コメント・各種マスター・ユーザー・権限の変更について、誰がいつ何を変更したかを記録する。
  - 監査ログは無期限保持。本文や変更前後の値は対象削除後も保持する。画像本体は削除し、削除者・日時・ファイル名などの情報を残す。
  - 監査ログはシステム管理者が全体、プロジェクト管理者が当該プロジェクト分を閲覧できる。一般参加者は管理者向けログを閲覧できない。
  - 例外として、参加者はチケット画面でそのチケットの変更ログをそのまま閲覧できる。Wiki履歴は修正者と修正日時のみ閲覧できる。
  decision_reason: ユーザーが会話で確認・承認した要件。
  related_ids:
  - DATA-009
  - API-010
  - UI-009
- id: OV-013
  title: Markdownと画像
  status: 確定
  requirements:
  - チケット説明・コメント・Wiki本文はMarkdown入力とプレビューを提供する。
  - 画像はPNG・JPEG・GIF・WebP。1枚最大10MB、チケット本体ごと・コメント1件ごと・Wikiページごとに最大10枚。
  - 画像ファイルはアプリサーバー上の永続化領域に保存し、外部ストレージサービスを利用しない。
  decision_reason: ユーザーが会話で確認・承認した要件。
  related_ids:
  - DATA-008
  - UI-007
  - API-008
  - INF-003
- id: OV-014
  title: 一般的な安全な実装
  status: 確定
  requirements:
  - Django標準のパスワードハッシュ、セッション認証、CSRF対策を利用する。認可は画面表示だけでなくすべてのバックエンド操作で検査する。
  - 入力値はサーバー側で検証する。Markdownの描画結果と履歴の表示はスクリプト実行を許さないようにエスケープ・無害化する。
  - パスワード・仮パスワード・ハッシュ・セッション値などの認証秘密は変更ログにも保存しない。初期化や変更の発生事実のみ記録する。
  - 画像配信時も親リソースと同じ認可を実施し、保存ファイルを一般公開URLで無条件に公開しない。
  decision_reason: AI補完。確認済みの認証・閲覧権限を実装し、秘密情報を本文等の監査対象と誤解して保存しないための技術的対策。追加の認証ポリシーは決定しない。
  related_ids:
  - OV-005
  - OV-007
  - OV-012
  - API-001
  - API-008
