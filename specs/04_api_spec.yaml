- id: API-011
  title: 検索とガント取得
  status: 確定
  requirements:
  - 'GET /tickets: project_id,status_id,type_id,assignee_id,priority,q,page,page_sizeを受け付ける。GET /tickets/mineはログインユーザーの担当に固定する。'
  - プロジェクト参加範囲の認可を先に適用し、UI-003のAND/OR・部分一致・並び順・ページサイズに従う。
  - 'GET /projects/{id}/gantt: from,to,page,page_sizeを受け付け、開始日・期限の両方があり指定期間と重なるチケットを返す。'
  - 日付形式やfrom<=toを検証する。親子表示に必要な親ID・名称は同一プロジェクトの認可内で返す。
  decision_reason: AI補完。一般的なCRUD・入力検証・技術的整合性を具体化するため。
  related_ids:
