  - OV-014
  - OV-020
  - DATA-008
- id: API-009
  title: マスター操作
  status: 確定
  requirements:
  - GET/POST /projects/{id}/statuses、PATCH /projects/{id}/statuses/{status_id}。種別はstatusesをtypesに置換したルート。
  - 一覧参照は参加者およびシステム管理者、変更は当該プロジェクト管理者およびシステム管理者。システム管理者は参加者・プロジェクト管理者を兼ねなくても変更できる。
  - PATCHで名称変更・is_active切替を扱う。必須ステータスの名称変更・無効化は409。DELETEは提供しない。
  - 無効化済みマスターの既存参照は保持する。新たな選択は拒否する。
  decision_reason: AI補完。一般的なCRUD・入力検証・技術的整合性を具体化するため。
  related_ids:
  - OV-005
  - OV-020
  - DATA-004
- id: API-010
  title: 監査ログ参照
  status: 確定
  requirements:
  - 'GET /audit-events: システム管理者は全体、プロジェクト管理者は自分のプロジェクトだけを取得可能。サーバー側で参照範囲を制限。'
  - 'GET /tickets/{id}/history: 当該チケットの閲覧権限を持つユーザーが関連ログをそのまま取得する。'
  - ログへのPOST/PATCH/DELETEは提供しない。削除済みチケットの一般参加者向け履歴は未決。
  decision_reason: AI補完。一般的なCRUD・入力検証・技術的整合性を具体化するため。
