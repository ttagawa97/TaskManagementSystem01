- id: API-014
  title: P2フォーム操作の実装範囲
  status: 確定
  requirements:
  - /auth/login、/auth/logout、/auth/password/change、/users、/users/new、/users/{id}、/users/{id}/reset-passwordをDjango画面・POSTフォームとして提供する。JSON APIの重複実装は行わない。
  - P2のユーザー編集はユーザーID・表示名・システム管理者権限。ユーザー無効化・参加者削除はP4まで公開せず、is_active等の余分な入力で変更できない。
  - 未認証の画面GETはログインへ誘導、未認証の更新POSTは401、仮パスワード未変更の業務POSTと権限外操作は403。フォーム入力不備は400、最後の管理者制限・重複IDは409。
  - 初期管理者作成コマンドは最初の通常ユーザー作成専用。既存通常ユーザーがいる場合は拒否する。新規ユーザーとして初回パスワード変更を必須とする。
  decision_reason: AI補完。既存API-001のフォーム方式と段階計画を具体化し、未実装制約を回避する操作経路を設けない。初期管理者にもOV-007の新規ユーザー規則を適用。
  related_ids: [API-001, API-002, API-003, OV-007, OV-020, OV-021, UI-002, UI-010]

- id: API-015
  title: P3フォーム操作と認可
  status: 確定
  requirements:
  - /projectsで一覧、/projects/newで作成、/projects/{id}で詳細、/projects/{id}/editで基本情報編集、/projects/{id}/membersで参加者一覧・追加を提供する。
  - /projects/{id}/members/{user_id}/roleで管理者指定・解除、/projects/{id}/archiveおよびunarchiveで対象名付き確認と実行を提供する。
  - /projects/{id}/statusesおよびtypesで一覧、末尾/newで追加、末尾/{master_id}で編集・有効切替を提供する。GETは表示、更新はCSRF付きPOSTフォーム。
  - システム管理者は全プロジェクト、一般ユーザーは参加プロジェクトのみ閲覧可能。対象外は404、権限外の変更は403。マスターID・参加ユーザーIDは必ずURLのプロジェクト内で検査する。
  - アーカイブ中の基本情報編集・参加者追加・管理者変更・マスター変更は409で拒否する。解除はシステム管理者または当該プロジェクト管理者のみ。
  - 管理者指定・解除と基本情報編集・プロジェクト作成はシステム管理者のみ。参加者追加では管理者権限を直接付与しない。unknown・無効ユーザーは追加不可。
  - 最後の有効なプロジェクト管理者の解除、重複マスター名・参加者、必須ステータスの変更・無効化は拒否する。参加者削除・担当一括解除はP4まで公開しない。
  - 変更はP2のユーザー更新ロック、対象プロジェクトの行ロックの順で取得し、最新の操作者・権限・アーカイブ状態を再検査する。監査失敗時は業務変更も取り消す。
  decision_reason: 承認済み権限とアーカイブ制約を反映。AI補完として既存フォーム方式・トランザクション・対象参照検査を具体化。
  related_ids: [API-001, API-004, API-009, OV-005, OV-011, OV-020, DATA-010]
