  title: 外部接続
  status: 保留
  requirements:
  - 外部公開APIは実装しない。Git連携・通知に関する外部接続は将来機能として保留。接続先・資格情報・課金・外部アカウントを仮定しない。
  decision_reason: ユーザーが会話で確認・承認した要件。
